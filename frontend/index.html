<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chunking Rules — Document Chunking Playground</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b22;
    --panel-2: #1e232c;
    --border: #2a303b;
    --text: #e6e9ef;
    --muted: #98a2b3;
    --accent: #6ea8fe;
    --accent-soft: #24344d;
    --green: #6ee7a8;
    --amber: #f4c86b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 0; min-height: calc(100vh - 63px); }
  .sidebar { border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; }
  .main { padding: 24px 28px; overflow-y: auto; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 12px; }

  .strategy {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .strategy:hover { border-color: #3a4252; background: var(--panel-2); }
  .strategy.selected { border-color: var(--accent); background: var(--accent-soft); }
  .strategy input { margin-top: 3px; accent-color: var(--accent); }
  .strategy .name { font-size: 13.5px; font-weight: 600; }
  .strategy .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 6px; margin-left: 6px;
    background: #2a2f0e; color: var(--amber); vertical-align: middle;
  }
  .strategy .badge.emb { background: #0e2a24; color: var(--green); }
  .strategy .desc { font-size: 12px; color: var(--muted); margin-top: 3px; display: none; }
  .strategy.selected .desc { display: block; }

  .controls { margin-top: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input[type=number], .field input[type=file], .field input[type=text], textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 9px 10px; font-size: 13px; font-family: inherit;
  }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  textarea { resize: vertical; min-height: 70px; }
  .dropzone {
    border: 1.5px dashed var(--border); border-radius: 10px; padding: 16px; text-align: center;
    font-size: 13px; color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s;
  }
  .dropzone.hover { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone strong { color: var(--text); }
  .filename { font-size: 12px; color: var(--green); margin-top: 8px; word-break: break-all; }
  .divider { text-align: center; color: var(--muted); font-size: 11px; margin: 12px 0; position: relative; }

  button.run {
    width: 100%; background: var(--accent); color: #0b1020; border: none;
    border-radius: 9px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
    margin-top: 6px; transition: opacity .15s;
  }
  button.run:hover { opacity: .9; }
  button.run:disabled { opacity: .5; cursor: not-allowed; }

  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; min-width: 96px;
  }
  .stat .v { font-size: 20px; font-weight: 700; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

  .chunk {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 12px;
  }
  .chunk-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
  .chunk-head .id { font-size: 12px; font-weight: 700; color: var(--accent); }
  .chunk-head .meta { font-size: 11px; color: var(--muted); text-align: right; }
  .chunk-body { font-size: 13px; white-space: pre-wrap; word-break: break-word; color: #d4d9e2; }
  .metatags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .metatag { font-size: 10.5px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); padding: 1px 7px; border-radius: 6px; }
  .children { margin-top: 12px; padding-left: 14px; border-left: 2px solid var(--accent-soft); }
  .child { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; margin-bottom: 8px; }
  .child .id { font-size: 11px; color: var(--green); font-weight: 600; }
  .child .body { font-size: 12px; white-space: pre-wrap; word-break: break-word; color: #c3c9d4; margin-top: 4px; }

  .placeholder { color: var(--muted); font-size: 14px; text-align: center; margin-top: 80px; }
  .banner { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 16px; color: #cfe0ff; }
  .error { background: #2a1414; border: 1px solid #6b2b2b; color: #f4b0b0; }
  .spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid #0b1020; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .sidebar { border-right: none; border-bottom: 1px solid var(--border); } }
</style>
</head>
<body>
<header>
  <h1>🧩 Chunking Rules</h1>
  <p>Upload a document, pick a strategy, and see exactly how it splits.</p>
</header>

<div class="layout">
  <aside class="sidebar">
    <h2>Chunking Strategy</h2>
    <div id="strategies"></div>

    <div class="controls">
      <h2>Input</h2>
      <div class="dropzone" id="dropzone">
        <strong>Click to upload</strong> or drag a file<br />
        <span style="font-size:11px">PDF · DOCX · TXT · MD</span>
        <input type="file" id="file" accept=".pdf,.docx,.txt,.md,.markdown,.text" hidden />
      </div>
      <div class="filename" id="filename"></div>
      <div class="divider">— or paste text —</div>
      <div class="field">
        <textarea id="paste" placeholder="Paste raw text here…"></textarea>
      </div>
      <div class="divider">— or load from S3 —</div>
      <div class="field">
        <label for="s3Uri">S3 URI</label>
        <input type="text" id="s3Uri" placeholder="s3://my-bucket/path/to/document.pdf or s3://my-bucket/path/to/folder/" />
      </div>
      <div class="field">
        <label for="s3Region">AWS Region (optional)</label>
        <input type="text" id="s3Region" placeholder="us-east-1" />
      </div>

      <h2 style="margin-top:18px">Parameters</h2>
      <div class="two">
        <div class="field">
          <label for="size">Chunk Size (chars)</label>
          <input type="number" id="size" min="1" />
        </div>
        <div class="field">
          <label for="overlap">Chunk Overlap</label>
          <input type="number" id="overlap" min="0" />
        </div>
      </div>
      <button class="run" id="run">Chunk Document</button>
    </div>
  </aside>

  <main class="main">
    <div id="results">
      <div class="placeholder">Choose a strategy and provide a document to begin.</div>
    </div>
  </main>
</div>

<script>
const API = "";
let STRATEGIES = [];
let selected = null;
let pickedFile = null;

const $ = (id) => document.getElementById(id);

async function loadStrategies() {
  const res = await fetch(`${API}/api/strategies`);
  STRATEGIES = await res.json();
  const box = $("strategies");
  box.innerHTML = "";
  STRATEGIES.forEach((s, i) => {
    const el = document.createElement("label");
    el.className = "strategy" + (i === 0 ? " selected" : "");
    const badge = s.needs === "llm"
      ? '<span class="badge">LLM</span>'
      : s.needs === "embeddings"
      ? '<span class="badge emb">EMBED</span>'
      : "";
    el.innerHTML = `
      <input type="radio" name="strategy" value="${s.id}" ${i === 0 ? "checked" : ""} />
      <div>
        <div class="name">${s.name}${badge}</div>
        <div class="desc">${s.description}</div>
      </div>`;
    el.querySelector("input").addEventListener("change", () => selectStrategy(s.id));
    box.appendChild(el);
  });
  selectStrategy(STRATEGIES[0].id);
}

function selectStrategy(id) {
  selected = STRATEGIES.find((s) => s.id === id);
  document.querySelectorAll(".strategy").forEach((el) => {
    el.classList.toggle("selected", el.querySelector("input").value === id);
  });
  // Auto-fill this strategy's default size & overlap.
  $("size").value = selected.chunk_size;
  $("overlap").value = selected.chunk_overlap;
}

// ---- file upload / drag & drop ----
const dz = $("dropzone");
dz.addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => setFile(e.target.files[0]));
["dragenter", "dragover"].forEach((ev) =>
  dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add("hover"); })
);
["dragleave", "drop"].forEach((ev) =>
  dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove("hover"); })
);
dz.addEventListener("drop", (e) => setFile(e.dataTransfer.files[0]));

function setFile(f) {
  if (!f) return;
  pickedFile = f;
  $("filename").textContent = "📄 " + f.name;
  $("paste").value = "";
  $("s3Uri").value = "";
  $("s3Region").value = "";
}
$("paste").addEventListener("input", () => {
  if ($("paste").value.trim()) { pickedFile = null; $("filename").textContent = ""; $("file").value = ""; $("s3Uri").value = ""; $("s3Region").value = ""; }
});
$("s3Uri").addEventListener("input", () => {
  if ($("s3Uri").value.trim()) { pickedFile = null; $("filename").textContent = ""; $("file").value = ""; $("paste").value = ""; }
});

// ---- run ----
$("run").addEventListener("click", runChunking);

async function runChunking() {
  const btn = $("run");
  const size = parseInt($("size").value, 10);
  const overlap = parseInt($("overlap").value, 10);
  const paste = $("paste").value.trim();
  const s3Uri = $("s3Uri").value.trim();
  const s3Region = $("s3Region").value.trim();
  const sourceCount = [pickedFile, paste, s3Uri].filter(Boolean).length;

  if (sourceCount === 0) return showError("Upload a file, paste text, or provide an S3 URI first.");
  if (sourceCount > 1) return showError("Use exactly one source: file, text, or S3 URI.");
  if (!(size > 0)) return showError("Chunk size must be a positive number.");
  if (overlap < 0 || overlap >= size) return showError("Overlap must be ≥ 0 and less than chunk size.");

  const fd = new FormData();
  fd.append("strategy", selected.id);
  fd.append("chunk_size", size);
  fd.append("chunk_overlap", overlap);
  if (pickedFile) fd.append("file", pickedFile);
  else if (paste) fd.append("text", paste);
  else {
    fd.append("s3_uri", s3Uri);
    if (s3Region) fd.append("s3_region", s3Region);
  }

  btn.disabled = true;
  const original = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span> Chunking…';
  try {
    const res = await fetch(`${API}/api/chunk`, { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Request failed");
    render(data);
  } catch (err) {
    showError(err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

function showError(msg) {
  $("results").innerHTML = `<div class="banner error">⚠️ ${msg}</div>`;
}

function esc(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function metaTags(meta) {
  const keys = Object.keys(meta || {});
  if (!keys.length) return "";
  return `<div class="metatags">${keys
    .map((k) => `<span class="metatag">${esc(k)}: ${esc(meta[k])}</span>`)
    .join("")}</div>`;
}

function render(data) {
  const s = data.stats;
  const stats = [
    ["Chunks", s.chunk_count],
    ["Avg chars", s.avg_chars],
    ["Min / Max", `${s.min_chars} / ${s.max_chars}`],
    ["~Tokens", s.total_tokens_estimate],
    ["Total chars", s.total_chars],
  ];
  let html = `<div class="stats">${stats
    .map(([k, v]) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`)
    .join("")}</div>`;
  html += `<div class="banner"><strong>${esc(s.strategy_name)}</strong> — size ${s.chunk_size}, overlap ${s.chunk_overlap}. ${s.chunk_count} chunk(s).</div>`;

  html += data.chunks.map(renderChunk).join("");
  $("results").innerHTML = html;
}

function renderChunk(c) {
  let children = "";
  if (c.children && c.children.length) {
    children = `<div class="children">${c.children
      .map(
        (ch) => `<div class="child"><div class="id">Child ${ch.index + 1} · ${ch.char_count} chars</div><div class="body">${esc(ch.text)}</div></div>`
      )
      .join("")}</div>`;
  }
  return `
    <div class="chunk">
      <div class="chunk-head">
        <span class="id">Chunk ${c.index + 1}</span>
        <span class="meta">${c.char_count} chars · ~${c.token_estimate} tokens${c.children ? " · " + c.children.length + " children" : ""}</span>
      </div>
      <div class="chunk-body">${esc(c.text)}</div>
      ${metaTags(c.metadata)}
      ${children}
    </div>`;
}

loadStrategies();
</script>
</body>
</html>
